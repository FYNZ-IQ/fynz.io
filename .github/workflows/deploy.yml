name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight deploy finish rather than cancel.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static export
        env:
          # No GITHUB_PAGES flag: the site is served from the root of the
          # custom domain in public/CNAME, not a project subpath, so
          # next.config.ts needs no basePath.
          # Set this repository variable to your deployed onboarding-bridge
          # base URL (e.g. https://bridge.fynz.io). If unset, the wizard
          # renders but submissions show a graceful "not wired up" error.
          NEXT_PUBLIC_ONBOARDING_BRIDGE_URL: ${{ vars.NEXT_PUBLIC_ONBOARDING_BRIDGE_URL }}
        run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
